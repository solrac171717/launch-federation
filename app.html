<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS — Global Portfolio (app preview)</title>
<meta name="description" content="ATLAS maps your investments across the world: exposure by country, allocation by asset class, and per-asset performance.">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1220'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d4b26a' stroke-width='2'/%3E%3Cpath d='M7 16h18M16 7c4 4 4 14 0 18M16 7c-4 4-4 14 0 18' fill='none' stroke='%23d4b26a' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <a class="brand" href="#/" aria-label="ATLAS home">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6 16h20M16 6c4.5 4.5 4.5 15.500 0 20M16 6c-4.500 4.500-4.500 15.500 0 20" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    <span>ATLAS</span>
  </a>
  <nav class="actions" aria-label="Portfolio actions">
    <a class="btn ghost" href="index.html">Website</a>
    <button class="btn ghost" id="refresh" type="button">Refresh prices</button>
    <button class="btn ghost" id="export-csv" type="button">Export CSV</button>
    <button class="btn ghost" id="export-json" type="button">Backup</button>
    <button class="btn ghost" id="import" type="button">Restore</button>
    <input id="import-file" type="file" accept="application/json,.json" hidden>
    <button class="btn primary" id="add" type="button">Add holding</button>
  </nav>
</header>

<main id="main" tabindex="-1">
  <div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

  <section id="view-dash" aria-labelledby="h-dash">
    <h1 id="h-dash" class="sr">Portfolio overview</h1>
    <div class="kpis" id="kpis" aria-live="polite"></div>

    <div class="stage">
      <section class="panel map-panel" aria-labelledby="h-map">
        <header class="panel-h">
          <div><h2 id="h-map">Global exposure</h2><p class="sub" id="map-sub"></p></div>
          <button class="btn ghost small" id="clear-country" type="button" hidden>Clear country</button>
        </header>
        <div id="map" class="map" aria-busy="true"><div class="skeleton map-skel" aria-label="Loading map"></div></div>
        <div class="scale" aria-hidden="true"><span>Lower exposure</span><i></i><span>Higher exposure</span></div>
      </section>

      <aside class="panel side" aria-labelledby="h-side">
        <header class="panel-h"><div><h2 id="h-side">Allocation</h2><p class="sub" id="side-sub">By asset class</p></div></header>
        <div id="donut" class="donut-host"></div>
        <h3 class="mini">Top countries</h3>
        <div id="country-bars"></div>
      </aside>
    </div>

    <section class="panel" aria-labelledby="h-hist">
      <header class="panel-h"><div><h2 id="h-hist">Portfolio value</h2><p class="sub">Daily values recorded each time you open ATLAS — never estimated</p></div></header>
      <div id="history" class="chart-host"></div>
    </section>

    <section class="panel" aria-labelledby="h-table">
      <header class="panel-h">
        <div><h2 id="h-table">Holdings</h2><p class="sub" id="table-sub"></p></div>
      </header>
      <div id="table-host" class="table-wrap" tabindex="0" role="region" aria-labelledby="h-table"></div>
    </section>
  </section>

  <section id="view-asset" hidden aria-labelledby="h-asset"></section>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
  <form method="dialog" id="form" novalidate>
    <h2 id="dlg-title">Add holding</h2>
    <div class="grid">
      <label class="f span2">Name<input name="name" autocomplete="off" required><small class="err" data-for="name"></small></label>
      <label class="f">Symbol <em>(optional)</em><input name="symbol" autocomplete="off"></label>
      <label class="f">Asset class
        <select name="class" required></select><small class="err" data-for="class"></small></label>
      <label class="f span2">Country of exposure<select name="countryId" required></select><small class="err" data-for="countryId"></small></label>
      <label class="f">Quantity<input name="quantity" inputmode="decimal" required><small class="err" data-for="quantity"></small></label>
      <label class="f">Cost per unit (USD)<input name="costPerUnit" inputmode="decimal" required><small class="err" data-for="costPerUnit"></small></label>
      <label class="f">Current price (USD)<input name="price" inputmode="decimal"><small class="hint">Leave empty if unknown — carried at cost</small><small class="err" data-for="price"></small></label>
      <label class="f">CoinGecko id <em>(live price)</em><input name="coingeckoId" placeholder="e.g. bitcoin" autocomplete="off"></label>
    </div>
    <div class="dlg-actions">
      <button class="btn ghost" type="button" id="cancel">Cancel</button>
      <button class="btn primary" type="submit">Save holding</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
